# -------------------------------------------------------------------------
# This file controls default concretization preferences for Spack.
#
# Settings here are versioned with Spack and are intended to provide
# sensible defaults out of the box. Spack maintainers should edit this
# file to keep it current.
#
# Users can override these settings by editing the following files.
#
# Per-spack-instance settings (overrides defaults):
#   $SPACK_ROOT/etc/spack/packages.yaml
#
# Per-user settings (overrides default and site settings):
#   ~/.spack/packages.yaml
# -------------------------------------------------------------------------
packages:
  all:
    providers:
      awk: [gawk]
      armci: [armcimpi]
      blas: [openblas]
      c: [gcc, llvm, intel-oneapi-compilers]
      cuda-lang: [cuda]
      cxx: [gcc, llvm, intel-oneapi-compilers]
      daal: [intel-oneapi-daal]
      elf: [elfutils]
      fftw-api: [fftw, amdfftw]
      flame: [libflame, amdlibflame]
      fortran: [gcc, llvm, intel-oneapi-compilers]
      fortran-rt: [gcc-runtime, intel-oneapi-runtime]
      fuse: [libfuse]
      gl: [glx, osmesa]
      glu: [mesa-glu, openglu]
      golang: [go, gcc]
      go-or-gccgo-bootstrap: [go-bootstrap, gcc]
      hip-lang: [llvm-amdgpu]
      iconv: [libiconv]
      ipp: [intel-oneapi-ipp]
      java: [openjdk, jdk]
      jpeg: [libjpeg-turbo, libjpeg]
      lapack: [openblas]
      libc: [glibc, musl]
      libgfortran: [gcc-runtime]
      libglx: [mesa+glx]
      libifcore: [intel-oneapi-runtime]
      libllvm: [llvm]
      lua-lang: [lua, lua-luajit-openresty, lua-luajit]
      luajit: [lua-luajit-openresty, lua-luajit]
      mariadb-client: [mariadb-c-client, mariadb]
      mkl: [intel-oneapi-mkl]
      mpe: [mpe2]
      mpi: [openmpi, mpich]
      mysql-client: [mysql, mariadb-c-client]
      opencl: [pocl]
      onedal: [intel-oneapi-dal]
      pbs: [openpbs, torque]
      pil: [py-pillow]
      pkgconfig: [pkgconf, pkg-config]
      qmake: [qt-base, qt]
      rpc: [libtirpc]
      scalapack: [netlib-scalapack, amdscalapack]
      sycl: [hipsycl]
      szip: [libaec, libszip]
      tbb: [intel-tbb]
      unwind: [libunwind]
      uuid: [util-linux-uuid, libuuid]
      wasi-sdk: [wasi-sdk-prebuilt]
      xkbdata-api: [xkeyboard-config, xkbdata]
      xxd: [xxd-standalone, vim]
      yacc: [bison, byacc]
      ziglang: [zig]
      zlib-api: [zlib-ng+compat, zlib]
    permissions:
      read: world
      write: user
  cce:
    buildable: false
  cray-fftw:
    buildable: false
  cray-libsci:
    buildable: false
  cray-mpich:
    buildable: false
  cray-mvapich2:
    buildable: false
  cray-pmi:
    buildable: false
  egl:
    buildable: false
  essl:
    buildable: false
  fj:
    buildable: false
  fujitsu-mpi:
    buildable: false
  fujitsu-ssl2:
    buildable: false
  glibc:
    buildable: false
  hpcx-mpi:
    buildable: false
  iconv:
    prefer: [libiconv]
  mpt:
    buildable: false
  musl:
    buildable: false
  opengl:
    buildable: false
  spectrum-mpi:
    buildable: false
  xl:
    buildable: false
##########################################################################################
  #                                       Compilers                                        #
  ##########################################################################################
  gcc:
    externals:
    - spec: gcc@14.3.1 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    - spec: gcc@10.3.0 languages:='c,c++,fortran'
      prefix: /sw/spack/opt/pkgs/gcc/10.3.0-gcc-14.3.1-kgnb
      extra_attributes:
        compilers:
          c: /sw/spack/opt/pkgs/gcc/10.3.0-gcc-14.3.1-kgnb/bin/gcc
          cxx: /sw/spack/opt/pkgs/gcc/10.3.0-gcc-14.3.1-kgnb/bin/g++
          fortran: /sw/spack/opt/pkgs/gcc/10.3.0-gcc-14.3.1-kgnb/bin/gfortran
  ##########################################################################################
  #                                       Externals                                        #
  ##########################################################################################
  perl:
    externals:
    - spec: perl@5.40.2
      prefix: /usr
  icu4c:
    buildable: false
    externals:
    - spec: icu4c@74.2
      prefix: /usr
  openjdk:
    buildable: true
    externals:
    - spec: openjdk@21.0.12
      prefix: /usr/lib/jvm/jre
  autoconf:
    buildable: false
    externals:
    - spec: autoconf@2.71
      prefix: /usr
  pkgconf:
    buildable: false
    externals:
    - spec: pkgconf@2.1.0
      prefix: /usr
  openssl:
    buildable: false
    externals:
    - spec: openssl@3.5.5
      prefix: /usr
  tar:
    buildable: false
    externals:
    - spec: tar@1.35
      prefix: /usr
  curl:
    buildable: true
    externals:
    - spec: curl@8.12.1
      prefix: /usr
  expat:
    buildable: false
    externals:
    - spec: expat@2.7.3
      prefix: /usr
  json-c:
    buildable: True
    externals:
    - spec: json-c@0.18
      prefix: /usr
  readline:
    buildable: false
    externals:
    - spec: readline@8.2
      prefix: /usr
  hwloc:
    buildable: false
    externals:
    - spec: hwloc@2.11.1
      prefix: /usr
  pmix:
    buildable: false
    externals:
    - spec: pmix@5.0.11
      prefix: /opt/pmix/5.0.11
    - spec: pmix@6.1.0
      prefix: /opt/pmix/6.1.0
  fribidi:
    buildable: false
    externals:
    - spec: fribidi@1.0.14
      prefix: /usr
  libxcb:
    buildable: false
    externals:
    - spec: libxcb@1.17.0
      prefix: /usr
  bash:
    buildable: false
    externals:
    - spec: bash@5.2.26
      prefix: /usr
  git:
    buildable: false
    externals:
    - spec: git@2.52.0
      prefix: /usr
  bzip2:
    buildable: false
    externals:
    - spec: bzip2@1.0.8
      prefix: /usr
  libtiff:
    buildable: true
    externals:
    - spec: libtiff@4.6.0
      prefix: /usr
  fontconfig:
    buildable: false
    externals:
    - spec: fontconfig@2.15.0
      prefix: /usr
  libwebp:
    buildable: true
    externals:
    - spec: libwebp@1.3.2
